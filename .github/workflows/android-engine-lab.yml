name: ODPAR Android Engine Lab v0.2

on:
  push:
    branches: [agent/android-engine-lab-v052]
    paths: ['.github/workflows/android-engine-lab.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize verified Android Lab v0.2 source
        env:
          APP_SHA256: a0b82b5be30f88ba5ab73352329fcd1577392bcb84642c1bf874ec6b208a4d56
        shell: bash
        run: |
          set -euxo pipefail
          cat .odpar/android-v02/app_payload.part00 \
              .odpar/android-v02/app_payload.part01 \
              .odpar/android-v02/app_payload.part02 \
              .odpar/android-v02/app_payload.part03 \
              .odpar/android-v02/app_payload.part04 | base64 -d > /tmp/android-lab-v02.tar.gz
          echo "$APP_SHA256  /tmp/android-lab-v02.tar.gz" | sha256sum -c -
          rm -rf android
          mkdir android
          tar -xzf /tmp/android-lab-v02.tar.gz -C android
          test -f android/app/src/main/cpp/extended_bridge.c
          test -f android/app/src/main/cpp/android_test_runner.c

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Fetch and verify exact official ODPAR 0.52 ZIP
        env:
          ODPAR_DRIVE_ID: 117etA7LrenJFEpgzYeRhD19T_jlY-TmA
          ODPAR_SHA256: 64d786ca5850519a324d2aff70f26134ac25ff4edb959da943e093f82cc47fc8
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check -q gdown
          gdown "$ODPAR_DRIVE_ID" -O /tmp/ODPAR-Music-Motion-LATEST.zip
          echo "$ODPAR_SHA256  /tmp/ODPAR-Music-Motion-LATEST.zip" | sha256sum -c -
          mkdir -p android/app/src/main/cpp/engine android/app/src/main/cpp/generated android/app/src/main/cpp/third_party
          unzip -q /tmp/ODPAR-Music-Motion-LATEST.zip -d android/app/src/main/cpp/engine
          test "$(find android/app/src/main/cpp/engine/src -name '*.c' | wc -l)" -eq 184
          test "$(find android/app/src/main/cpp/engine/src -name '*.c' ! -path '*/cli/*' | wc -l)" -eq 182
          test "$(find android/app/src/main/cpp/engine/tests/unit android/app/src/main/cpp/engine/tests/properties -name '*.c' | wc -l)" -eq 74
          grep -q '0.52.0-world3d-shadow-material-wip-v52' android/app/src/main/cpp/engine/CHECKPOINT_STATUS.json
          grep -q '"abi_version": 11' android/app/src/main/cpp/engine/CHECKPOINT_STATUS.json
          python android/app/src/main/cpp/engine/tools/gen_build_meta.py --output android/app/src/main/cpp/generated/odm_build_meta.h

      - name: Build OpenSSL 3.5.3 for Android ARM64
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/openssl-src
          git clone --depth 1 --branch openssl-3.5.3 https://github.com/openssl/openssl.git /tmp/openssl-src
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          DEST="$GITHUB_WORKSPACE/android/app/src/main/cpp/third_party/openssl"
          cd /tmp/openssl-src
          ./Configure android-arm64 -D__ANDROID_API__=28 no-shared no-tests no-apps no-docs --prefix="$DEST"
          make -j2 build_libs
          make install_dev
          cp "$DEST/lib/libcrypto.a" "$DEST/libcrypto.a"
          test -s "$DEST/libcrypto.a"
          test -s "$DEST/include/openssl/evp.h"

      - name: Fetch libpng 1.6.50 source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.6.50 https://github.com/pnggroup/libpng.git android/app/src/main/cpp/third_party/libpng

      - name: Apply audited Android portability wiring
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/cpp/CMakeLists.txt')
          s = p.read_text()

          png_anchor = 'add_subdirectory("${CMAKE_CURRENT_SOURCE_DIR}/third_party/libpng" "${CMAKE_CURRENT_BINARY_DIR}/libpng")'
          assert png_anchor in s, 'libpng add_subdirectory anchor missing; refusing blind patch'
          png_wiring = png_anchor + '''\n# Android port: png.c is compiled inside odpar_engine before final linking, so\n# it must see libpng source headers and the generated pnglibconf.h here.\n# This preserves the native PNG module; it does not exclude or replace it.\ntarget_include_directories(odpar_engine PRIVATE\n  "${CMAKE_CURRENT_SOURCE_DIR}/third_party/libpng"\n  "${CMAKE_CURRENT_BINARY_DIR}/libpng")'''
          assert 'Android port: png.c is compiled inside odpar_engine' not in s
          s = s.replace(png_anchor, png_wiring, 1)

          test_anchor = '''target_include_directories(odpar_lab PRIVATE
  "${ENGINE_ROOT}/include" "${ENGINE_ROOT}/src/cli" "${ENGINE_ROOT}/tests" "${CMAKE_CURRENT_SOURCE_DIR}")'''
          assert test_anchor in s, 'test include anchor missing; refusing blind patch'
          test_wiring = '''# Android certification lane: official tests intentionally include private\n# engine headers (for example visual_internal.h). Discover the directories\n# containing official internal/test headers instead of weakening those tests.\nfile(GLOB_RECURSE ODM_TEST_PRIVATE_HEADERS CONFIGURE_DEPENDS\n  "${ENGINE_ROOT}/src/*.h"\n  "${ENGINE_ROOT}/tests/*.h")\nset(ODM_TEST_PRIVATE_INCLUDE_DIRS "")\nforeach(_odm_test_header IN LISTS ODM_TEST_PRIVATE_HEADERS)\n  get_filename_component(_odm_test_header_dir "${_odm_test_header}" DIRECTORY)\n  list(APPEND ODM_TEST_PRIVATE_INCLUDE_DIRS "${_odm_test_header_dir}")\nendforeach()\nlist(REMOVE_DUPLICATES ODM_TEST_PRIVATE_INCLUDE_DIRS)\ntarget_include_directories(odpar_lab PRIVATE\n  "${ENGINE_ROOT}/include" "${ENGINE_ROOT}/src/cli" "${ENGINE_ROOT}/tests" "${CMAKE_CURRENT_SOURCE_DIR}"\n  ${ODM_TEST_PRIVATE_INCLUDE_DIRS})'''
          s = s.replace(test_anchor, test_wiring, 1)
          p.write_text(s)
          PY
          grep -A7 -B2 'Android port: png.c' android/app/src/main/cpp/CMakeLists.txt
          grep -A15 -B2 'Android certification lane: official tests' android/app/src/main/cpp/CMakeLists.txt

      - name: Build APK with complete production and official test surfaces
        shell: bash
        run: |
          set +e
          gradle -p android --no-daemon --stacktrace :app:assembleDebug > android/build.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo '=== ODPAR ANDROID COMPILER/LINKER ERRORS ==='
            grep -nE 'error:|fatal error:|undefined reference|CMake Error|ninja: build stopped|FAILURE:|What went wrong|Execution failed for task' android/build.log | tail -n 500 || true
            tail -n 320 android/build.log || true
          else
            tail -n 120 android/build.log || true
          fi
          exit "$rc"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ODPAR-Android-v02-build-log
          path: android/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK and extended JNI surface
        shell: bash
        run: |
          set -euxo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -p "$APK" lib/arm64-v8a/libodpar_lab.so > android/libodpar_lab.so
          test -s android/libodpar_lab.so
          file android/libodpar_lab.so | tee android/native-file.txt
          nm -D android/libodpar_lab.so | grep Java_com_odpar_musicmotionlab_MainActivity_nativeRenderScene
          nm -D android/libodpar_lab.so | grep Java_com_odpar_musicmotionlab_MainActivity_nativeFullTestSuite
          nm -D android/libodpar_lab.so | grep Java_com_odpar_musicmotionlab_MainActivity_nativeAnalyzeAudio
          nm -D android/libodpar_lab.so | grep Java_com_odpar_musicmotionlab_MainActivity_nativeInspectOdparms
          sha256sum "$APK" android/libodpar_lab.so | tee android/APK_SHA256.txt
          cp "$APK" android/ODPAR-Music-Motion-Engine-Lab-v0.2-arm64.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ODPAR-Music-Motion-Engine-Lab-v0.2-arm64
          path: |
            android/ODPAR-Music-Motion-Engine-Lab-v0.2-arm64.apk
            android/APK_SHA256.txt
            android/native-file.txt
          if-no-files-found: error
          retention-days: 30
