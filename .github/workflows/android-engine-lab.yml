name: ODPAR Android Engine Lab

on:
  push:
    branches: [agent/android-engine-lab-v052]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;29.0.14206865"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Fetch exact official ODPAR 0.52 ZIP
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --user --disable-pip-version-check gdown
          python3 -m gdown 'https://drive.google.com/uc?id=117etA7LrenJFEpgzYeRhD19T_jlY-TmA' -O /tmp/ODPAR-Music-Motion-LATEST.zip
          echo '64d786ca5850519a324d2aff70f26134ac25ff4edb959da943e093f82cc47fc8  /tmp/ODPAR-Music-Motion-LATEST.zip' | sha256sum -c -
          rm -rf engine_official
          mkdir engine_official
          unzip -q /tmp/ODPAR-Music-Motion-LATEST.zip -d engine_official
          test "$(find engine_official/src -type f -name '*.c' | wc -l)" -eq 184
          python3 engine_official/tools/gen_build_meta.py --output engine_official/build-android/generated/odm_build_meta.h
          grep -E 'ODM_BUILD_SOURCE_ID|ODM_INVENTORY_SOURCE_FILE_COUNT' engine_official/build-android/generated/odm_build_meta.h

      - name: Build OpenSSL 3.5.2 for arm64-v8a
        shell: bash
        run: |
          set -euxo pipefail
          THIRD="$GITHUB_WORKSPACE/android/app/src/main/cpp/third_party"
          rm -rf /tmp/openssl-src "$THIRD/openssl"
          git clone --depth 1 --branch openssl-3.5.2 https://github.com/openssl/openssl.git /tmp/openssl-src
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd /tmp/openssl-src
          ./Configure android-arm64 -D__ANDROID_API__=28 no-shared no-tests no-apps no-docs --prefix="$THIRD/openssl" --openssldir="$THIRD/openssl/ssl" --libdir=lib
          make -j2 build_libs
          make install_dev
          test -f "$THIRD/openssl/lib/libcrypto.a"
          test -f "$THIRD/openssl/include/openssl/evp.h"

      - name: Build zlib 1.3.1 for arm64-v8a
        shell: bash
        run: |
          set -euxo pipefail
          THIRD="$GITHUB_WORKSPACE/android/app/src/main/cpp/third_party"
          rm -rf /tmp/zlib-src /tmp/zlib-build "$THIRD/zlib"
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git /tmp/zlib-src
          cmake -S /tmp/zlib-src -B /tmp/zlib-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DZLIB_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$THIRD/zlib"
          cmake --build /tmp/zlib-build --parallel 2
          cmake --install /tmp/zlib-build
          test -f "$THIRD/zlib/lib/libz.a"

      - name: Build libpng 1.6.50 for arm64-v8a
        shell: bash
        run: |
          set -euxo pipefail
          THIRD="$GITHUB_WORKSPACE/android/app/src/main/cpp/third_party"
          rm -rf /tmp/png-src /tmp/png-build "$THIRD/png"
          git clone --depth 1 --branch v1.6.50 https://github.com/pnggroup/libpng.git /tmp/png-src
          cmake -S /tmp/png-src -B /tmp/png-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release -DPNG_SHARED=OFF -DPNG_STATIC=ON \
            -DPNG_TESTS=OFF -DPNG_TOOLS=OFF -DPNG_HARDWARE_OPTIMIZATIONS=OFF \
            -DZLIB_INCLUDE_DIR="$THIRD/zlib/include" -DZLIB_LIBRARY="$THIRD/zlib/lib/libz.a" \
            -DCMAKE_INSTALL_PREFIX="$THIRD/png"
          cmake --build /tmp/png-build --parallel 2
          cmake --install /tmp/png-build
          test -f "$THIRD/png/lib/libpng16.a"
          test -f "$THIRD/png/include/png.h"

      - name: Build APK with complete production surface
        shell: bash
        run: |
          set +e
          gradle -p android --no-daemon --stacktrace :app:assembleDebug > android/build.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo '=== ODPAR ANDROID COMPILER/LINKER ERRORS ==='
            grep -nE 'error:|fatal error:|undefined reference|CMake Error|ninja: build stopped|FAILURE:|What went wrong|Execution failed for task' android/build.log | tail -n 400 || true
            tail -n 260 android/build.log || true
          else
            tail -n 100 android/build.log || true
          fi
          exit "$rc"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ODPAR-Android-build-log
          path: android/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK payload
        shell: bash
        run: |
          set -euxo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          sha256sum "$APK" | tee android/APK_SHA256.txt
          unzip -l "$APK" | tee /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libodpar_lab.so' /tmp/apk-list.txt
          cp "$APK" android/ODPAR-Music-Motion-Engine-Lab-0.52-arm64.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ODPAR-Music-Motion-Engine-Lab-0.52-arm64
          path: |
            android/ODPAR-Music-Motion-Engine-Lab-0.52-arm64.apk
            android/APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30
