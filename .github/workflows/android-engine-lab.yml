name: Build ODPAR Android Engine Lab

on:
  push:
    branches: [ "agent/android-engine-lab-v052" ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android toolchain
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch and verify official ODPAR Music Motion 0.52 ZIP
        working-directory: android_engine_lab
        env:
          ODPAR_DRIVE_ID: 117etA7LrenJFEpgzYeRhD19T_jlY-TmA
          ODPAR_EXPECTED_SHA256: 64d786ca5850519a324d2aff70f26134ac25ff4edb959da943e093f82cc47fc8
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check -q gdown
          gdown "$ODPAR_DRIVE_ID" -O official-engine.zip
          echo "$ODPAR_EXPECTED_SHA256  official-engine.zip" | sha256sum -c -
          mkdir -p app/src/main/cpp/engine app/src/main/cpp/generated app/src/main/cpp/third_party
          unzip -q official-engine.zip -d app/src/main/cpp/engine
          test "$(find app/src/main/cpp/engine/src -name '*.c' ! -path '*/cli/*' | wc -l)" -eq 182
          grep -q '0.52.0-world3d-shadow-material-wip-v52' app/src/main/cpp/engine/CHECKPOINT_STATUS.json
          python app/src/main/cpp/engine/tools/gen_build_meta.py --output app/src/main/cpp/generated/odm_build_meta.h
          grep -q 'ODM_BUILD_SOURCE_ID' app/src/main/cpp/generated/odm_build_meta.h

      - name: Build OpenSSL 3.5.3 for Android ARM64
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch openssl-3.5.3 https://github.com/openssl/openssl.git /tmp/openssl-src
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd /tmp/openssl-src
          ./Configure android-arm64 -D__ANDROID_API__=28 no-shared no-tests no-ui-console \
            --prefix="$GITHUB_WORKSPACE/android_engine_lab/app/src/main/cpp/third_party/openssl-install"
          make -j2 build_sw
          make install_sw
          DEST="$GITHUB_WORKSPACE/android_engine_lab/app/src/main/cpp/third_party/openssl"
          mkdir -p "$DEST/include"
          cp -a "$GITHUB_WORKSPACE/android_engine_lab/app/src/main/cpp/third_party/openssl-install/include/openssl" "$DEST/include/"
          cp "$GITHUB_WORKSPACE/android_engine_lab/app/src/main/cpp/third_party/openssl-install/lib/libcrypto.a" "$DEST/libcrypto.a"
          test -s "$DEST/libcrypto.a"
          test -s "$DEST/include/openssl/evp.h"

      - name: Fetch libpng 1.6.50 for native PNG capability
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.6.50 https://github.com/pnggroup/libpng.git \
            "$GITHUB_WORKSPACE/android_engine_lab/app/src/main/cpp/third_party/libpng"

      - name: Build ARM64 APK with all 182 production C translation units
        working-directory: android_engine_lab
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug --stacktrace > build.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo '=== ODPAR ANDROID COMPILER/LINKER ERRORS ==='
            grep -nE 'error:|fatal error:|undefined reference|CMake Error|ninja: build stopped|FAILURE:|What went wrong|Execution failed for task' build.log | tail -n 350 || true
            echo '=== BUILD LOG TAIL ==='
            tail -n 250 build.log || true
          else
            echo '=== ODPAR ARM64 BUILD PASS ==='
            tail -n 80 build.log || true
          fi
          exit "$rc"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ODPAR-Android-build-log
          path: android_engine_lab/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK native payload
        working-directory: android_engine_lab
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libodpar_lab.so'
          unzip -p "$APK" lib/arm64-v8a/libodpar_lab.so > libodpar_lab.so
          file libodpar_lab.so | tee native-file.txt
          readelf -h libodpar_lab.so | tee native-elf.txt
          readelf -Ws libodpar_lab.so | grep -E 'odm_(spine|scene3d|music|preview|studio|export|pkg|compositor|reaction)' | head -250 | tee native-symbol-sample.txt || true
          sha256sum "$APK" libodpar_lab.so | tee apk-evidence.sha256
          cp "$APK" ODPAR-Music-Motion-Engine-Lab-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ODPAR-Music-Motion-Engine-Lab-APK
          path: |
            android_engine_lab/ODPAR-Music-Motion-Engine-Lab-arm64.apk
            android_engine_lab/apk-evidence.sha256
            android_engine_lab/native-file.txt
            android_engine_lab/native-elf.txt
            android_engine_lab/native-symbol-sample.txt
          if-no-files-found: error
          retention-days: 14
