name: Build ODPAR Android Engine Lab
on:
  push:
    branches: [ "claude/motor-improvement-sr808c" ]
    paths:
      - "android_engine_lab_payload.tar.gz"
      - ".github/workflows/android-engine-lab.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Publish active run pointer
        run: |
          mkdir -p android_engine_lab
          cat > android_engine_lab/RUN_POINTER.md <<EOF
          # Active Android Spatial Lab build

          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          source_commit=$GITHUB_SHA
          workflow=android-engine-lab.yml
          target=ODPAR-Music-Motion-Spatial-Lab-v0.4-arm64.apk
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android_engine_lab/RUN_POINTER.md
          git commit -m "Publish active Spatial Lab build pointer"
          git push origin HEAD:claude/motor-improvement-sr808c

      - name: Materialize Android app source
        run: |
          rm -rf android_engine_lab
          mkdir android_engine_lab
          tar -xzf android_engine_lab_payload.tar.gz -C android_engine_lab
          test -f android_engine_lab/app/src/main/cpp/CMakeLists.txt
          echo "d9698dc4caa4072f088e0c461ed97074bd415b88859c5a77f0d0ac59d1196942  android_engine_lab_payload.tar.gz" | sha256sum -c -

      - name: Harden launcher before native engine startup
        run: |
          python tools/patch_android_engine_lab_launch.py
          grep -q 'private static volatile boolean nativeLoaded = false' android_engine_lab/app/src/main/java/com/odpar/musicmotionlab/MainActivity.java
          ! grep -q 'static { System.loadLibrary("odpar_lab"); }' android_engine_lab/app/src/main/java/com/odpar/musicmotionlab/MainActivity.java

      - name: Publish launch-surface diagnostic snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('android_engine_lab')
          out = root / 'DIAGNOSTIC_SNAPSHOT.md'
          interesting = {
              '.xml', '.kt', '.java', '.c', '.h', '.cpp', '.cc', '.cmake',
              '.gradle', '.kts', '.properties', '.pro', '.txt', '.md'
          }
          lines = [
              '# Android Engine Lab launch-surface snapshot',
              '',
              'Generated by GitHub Actions from the exact payload used to build the APK after launcher hardening.',
              ''
          ]
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p == out:
                  continue
              rel = p.relative_to(root)
              if any(part in {'.gradle', 'build'} for part in rel.parts):
                  continue
              data = p.read_bytes()
              lines.append(f'## `{rel.as_posix()}`')
              lines.append('')
              lines.append(f'- size: {len(data)} bytes')
              if p.suffix.lower() in interesting or p.name in {'gradlew'}:
                  try:
                      text = data.decode('utf-8')
                  except UnicodeDecodeError:
                      text = None
                  if text is not None:
                      lines.extend(['', '```text', text.rstrip(), '```'])
              lines.append('')
          out.write_text('\n'.join(lines), encoding='utf-8')
          PY
          git add android_engine_lab/DIAGNOSTIC_SNAPSHOT.md
          if ! git diff --cached --quiet; then
            git commit -m "Capture hardened Android Engine Lab launch surface"
            git push origin HEAD:claude/motor-improvement-sr808c
          fi

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Fetch canonical ODPAR engine from Drive
        working-directory: android_engine_lab
        env:
          ODPAR_DRIVE_ID: 117etA7LrenJFEpgzYeRhD19T_jlY-TmA
          ODPAR_EXPECTED_SHA256: 64d786ca5850519a324d2aff70f26134ac25ff4edb959da943e093f82cc47fc8
        run: |
          python -m pip install --disable-pip-version-check -q gdown
          gdown "$ODPAR_DRIVE_ID" -O official-engine.zip
          echo "$ODPAR_EXPECTED_SHA256  official-engine.zip" | sha256sum -c -
          mkdir -p app/src/main/cpp/engine app/src/main/cpp/generated
          unzip -q official-engine.zip -d app/src/main/cpp/engine
          test "$(find app/src/main/cpp/engine/src -name '*.c' ! -path '*/cli/*' | wc -l)" -eq 182
          python app/src/main/cpp/engine/tools/gen_build_meta.py --output app/src/main/cpp/generated/odm_build_meta.h
          grep -q '0.52.0-world3d-shadow-material-wip-v52' app/src/main/cpp/engine/CHECKPOINT_STATUS.json

      - name: Fetch and build pinned native dependencies
        working-directory: android_engine_lab
        env:
          OPENSSL_COMMIT: 8cf17aaeb4599f8af87fefd810b5b5fee90fe69e
        run: |
          set -euxo pipefail
          ROOT="$PWD"
          THIRD="$ROOT/app/src/main/cpp/third_party"
          mkdir -p "$THIRD"

          git clone --depth 1 --branch v1.6.50 https://github.com/pnggroup/libpng.git "$THIRD/libpng"

          git clone --depth 1 --branch openssl-3.5.7 https://github.com/openssl/openssl.git "$THIRD/openssl-src"
          test "$(git -C "$THIRD/openssl-src" rev-parse HEAD)" = "$OPENSSL_COMMIT"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd "$THIRD/openssl-src"
          ./Configure android-arm64 -D__ANDROID_API__=28 no-shared no-tests no-apps no-docs \
            --prefix="$THIRD/openssl-install" --libdir=lib
          make -j2 build_libs
          make install_sw
          test -f "$THIRD/openssl-install/include/openssl/evp.h"
          test -s "$THIRD/openssl-install/lib/libcrypto.a"

          cat >> "$ROOT/app/src/main/cpp/CMakeLists.txt" <<'CMAKE'

          # Android Engine Lab portability bridge: retain the engine's native
          # Ed25519 package-signing and SHA-256 acceleration through OpenSSL 3.
          target_include_directories(odpar_engine PRIVATE
              "${CMAKE_CURRENT_SOURCE_DIR}/third_party/openssl-install/include"
          )
          target_link_libraries(odpar_engine PUBLIC
              "${CMAKE_CURRENT_SOURCE_DIR}/third_party/openssl-install/lib/libcrypto.a"
          )
          CMAKE

      - name: Build ARM64 APK
        working-directory: android_engine_lab
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify launcher and native payload
        working-directory: android_engine_lab
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libodpar_lab.so'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "launchable-activity: name='com.odpar.musicmotionlab.MainActivity'" apk-badging.txt
          unzip -p "$APK" lib/arm64-v8a/libodpar_lab.so > /tmp/libodpar_lab.so
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d /tmp/libodpar_lab.so | tee native-dynamic.txt
          sha256sum "$APK" | tee app-debug.apk.sha256
          cp "$APK" ODPAR-Music-Motion-Spatial-Lab-v0.4-arm64.apk

      - name: Publish successful build receipt
        working-directory: android_engine_lab
        run: |
          set -euxo pipefail
          {
            echo "# ODPAR Music Motion Spatial Lab v0.4 build receipt"
            echo
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "commit=$GITHUB_SHA"
            echo "artifact=ODPAR-Music-Motion-Spatial-Lab-v0.4-APK"
            echo "apk=ODPAR-Music-Motion-Spatial-Lab-v0.4-arm64.apk"
            echo "sha256=$(cut -d' ' -f1 app-debug.apk.sha256)"
            echo
            echo "## Launcher"
            grep "launchable-activity:" apk-badging.txt
            echo
            echo "## Native DT_NEEDED"
            grep NEEDED native-dynamic.txt || true
          } > BUILD_RECEIPT.md
          cp BUILD_RECEIPT.md ../android_engine_lab/BUILD_RECEIPT.md
          cd ..
          git add android_engine_lab/BUILD_RECEIPT.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish Spatial Lab v0.4 successful build receipt"
            git push origin HEAD:claude/motor-improvement-sr808c
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ODPAR-Music-Motion-Spatial-Lab-v0.4-APK
          path: |
            android_engine_lab/ODPAR-Music-Motion-Spatial-Lab-v0.4-arm64.apk
            android_engine_lab/app-debug.apk.sha256
            android_engine_lab/apk-badging.txt
            android_engine_lab/native-dynamic.txt
            android_engine_lab/BUILD_RECEIPT.md
          if-no-files-found: error
          retention-days: 14
