name: Build ODPAR Android Engine Lab
on:
  push:
    branches: [ "claude/motor-improvement-sr808c" ]
    paths:
      - "android_engine_lab_payload.tar.gz"
      - ".github/workflows/android-engine-lab.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Materialize Android app source
        run: |
          rm -rf android_engine_lab
          mkdir android_engine_lab
          tar -xzf android_engine_lab_payload.tar.gz -C android_engine_lab
          test -f android_engine_lab/app/src/main/cpp/CMakeLists.txt
          echo "d9698dc4caa4072f088e0c461ed97074bd415b88859c5a77f0d0ac59d1196942  android_engine_lab_payload.tar.gz" | sha256sum -c -

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Fetch canonical ODPAR engine from Drive
        working-directory: android_engine_lab
        env:
          ODPAR_DRIVE_ID: 117etA7LrenJFEpgzYeRhD19T_jlY-TmA
          ODPAR_EXPECTED_SHA256: 64d786ca5850519a324d2aff70f26134ac25ff4edb959da943e093f82cc47fc8
        run: |
          python -m pip install --disable-pip-version-check -q gdown
          gdown "$ODPAR_DRIVE_ID" -O official-engine.zip
          echo "$ODPAR_EXPECTED_SHA256  official-engine.zip" | sha256sum -c -
          mkdir -p app/src/main/cpp/engine app/src/main/cpp/generated
          unzip -q official-engine.zip -d app/src/main/cpp/engine
          test "$(find app/src/main/cpp/engine/src -name '*.c' ! -path '*/cli/*' | wc -l)" -eq 182
          python app/src/main/cpp/engine/tools/gen_build_meta.py --output app/src/main/cpp/generated/odm_build_meta.h
          grep -q '0.52.0-world3d-shadow-material-wip-v52' app/src/main/cpp/engine/CHECKPOINT_STATUS.json

      - name: Fetch and build pinned native dependencies
        working-directory: android_engine_lab
        env:
          OPENSSL_COMMIT: 8cf17aaeb4599f8af87fefd810b5b5fee90fe69e
        run: |
          set -euxo pipefail
          ROOT="$PWD"
          THIRD="$ROOT/app/src/main/cpp/third_party"
          mkdir -p "$THIRD"

          git clone --depth 1 --branch v1.6.50 https://github.com/pnggroup/libpng.git "$THIRD/libpng"

          git clone --depth 1 --branch openssl-3.5.7 https://github.com/openssl/openssl.git "$THIRD/openssl-src"
          test "$(git -C "$THIRD/openssl-src" rev-parse HEAD)" = "$OPENSSL_COMMIT"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd "$THIRD/openssl-src"
          ./Configure android-arm64 -D__ANDROID_API__=28 no-shared no-tests no-apps no-docs \
            --prefix="$THIRD/openssl-install" --libdir=lib
          make -j2 build_libs
          make install_sw
          test -f "$THIRD/openssl-install/include/openssl/evp.h"
          test -s "$THIRD/openssl-install/lib/libcrypto.a"

          cat >> "$ROOT/app/src/main/cpp/CMakeLists.txt" <<'CMAKE'

          # Android Engine Lab portability bridge: retain the engine's native
          # Ed25519 package-signing and SHA-256 acceleration through OpenSSL 3.
          target_include_directories(odpar_engine PRIVATE
              "${CMAKE_CURRENT_SOURCE_DIR}/third_party/openssl-install/include"
          )
          target_link_libraries(odpar_engine PUBLIC
              "${CMAKE_CURRENT_SOURCE_DIR}/third_party/openssl-install/lib/libcrypto.a"
          )
          CMAKE

      - name: Build ARM64 APK
        working-directory: android_engine_lab
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        working-directory: android_engine_lab
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libodpar_lab.so'
          sha256sum "$APK" | tee app-debug.apk.sha256
          cp "$APK" ODPAR-Music-Motion-Engine-Lab-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ODPAR-Music-Motion-Engine-Lab-APK
          path: |
            android_engine_lab/ODPAR-Music-Motion-Engine-Lab-arm64.apk
            android_engine_lab/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
