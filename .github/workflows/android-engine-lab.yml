name: Build ODPAR Android Engine Lab
on:
  push:
    branches: [ "android-engine-lab-v052" ]
    paths:
      - "android_engine_lab_payload.tar.gz"
      - ".github/workflows/android-engine-lab.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Materialize Android app source
        run: |
          set -euo pipefail
          rm -rf android_engine_lab
          mkdir android_engine_lab
          echo "4625a160a52c84c82aa592a194780176415b8d54b35b76df69b4dfd60b1ca08c  android_engine_lab_payload.tar.gz" | sha256sum -c -
          tar -xzf android_engine_lab_payload.tar.gz -C android_engine_lab
          test -f android_engine_lab/app/src/main/cpp/CMakeLists.txt
          grep -q "ndkVersion '29.0.14206865'" android_engine_lab/app/build.gradle

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android toolchain
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
          test -x "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Fetch canonical ODPAR 0.52 engine from Drive
        working-directory: android_engine_lab
        env:
          ODPAR_DRIVE_ID: 117etA7LrenJFEpgzYeRhD19T_jlY-TmA
          ODPAR_EXPECTED_SHA256: 64d786ca5850519a324d2aff70f26134ac25ff4edb959da943e093f82cc47fc8
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q gdown
          gdown "$ODPAR_DRIVE_ID" -O official-engine.zip
          echo "$ODPAR_EXPECTED_SHA256  official-engine.zip" | sha256sum -c -
          rm -rf app/src/main/cpp/engine
          mkdir -p app/src/main/cpp/engine app/src/main/cpp/generated
          unzip -q official-engine.zip -d app/src/main/cpp/engine
          test "$(find app/src/main/cpp/engine/src -name '*.c' | wc -l)" -eq 184
          test "$(find app/src/main/cpp/engine/src -name '*.c' ! -path '*/cli/*' | wc -l)" -eq 182
          grep -q '0.52.0-world3d-shadow-material-wip-v52' app/src/main/cpp/engine/CHECKPOINT_STATUS.json
          grep -q '"abi_version": 11' app/src/main/cpp/engine/CHECKPOINT_STATUS.json
          python app/src/main/cpp/engine/tools/gen_build_meta.py --output app/src/main/cpp/generated/odm_build_meta.h

      - name: Stage libpng 1.6.58
        working-directory: android_engine_lab
        run: |
          set -euo pipefail
          mkdir -p app/src/main/cpp/third_party
          rm -rf app/src/main/cpp/third_party/libpng
          git clone --depth 1 --branch v1.6.58 https://github.com/pnggroup/libpng.git app/src/main/cpp/third_party/libpng

      - name: Build OpenSSL 3.5.7 libcrypto for Android ARM64
        working-directory: android_engine_lab
        env:
          OPENSSL_COMMIT: 8cf17aaeb4599f8af87fefd810b5b5fee90fe69e
        run: |
          set -euo pipefail
          ROOT="$PWD"
          THIRD="$ROOT/app/src/main/cpp/third_party"
          rm -rf "$THIRD/openssl-src" "$THIRD/openssl"
          git clone --depth 1 --branch openssl-3.5.7 https://github.com/openssl/openssl.git "$THIRD/openssl-src"
          test "$(git -C "$THIRD/openssl-src" rev-parse HEAD)" = "$OPENSSL_COMMIT"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/29.0.14206865"
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd "$THIRD/openssl-src"
          perl Configure android-arm64 -D__ANDROID_API__=28 no-shared no-tests no-apps no-docs \
            --prefix="$THIRD/openssl" --libdir=lib
          make -j2 build_libs
          make install_dev
          test -f "$THIRD/openssl/include/openssl/evp.h"
          test -s "$THIRD/openssl/lib/libcrypto.a"
          cp "$THIRD/openssl/lib/libcrypto.a" "$THIRD/openssl/libcrypto.a"

      - name: Build full-surface ARM64 APK
        working-directory: android_engine_lab
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK and native ODPAR identity
        working-directory: android_engine_lab
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libodpar_lab.so'
          unzip -p "$APK" lib/arm64-v8a/libodpar_lab.so > /tmp/libodpar_lab.so
          test -s /tmp/libodpar_lab.so
          file /tmp/libodpar_lab.so | grep -q 'ARM aarch64'
          strings /tmp/libodpar_lab.so | grep -q '0.52.0-world3d-shadow-material-wip-v52'
          nm -D /tmp/libodpar_lab.so | grep 'Java_com_odpar_musicmotionlab_MainActivity_nativeRenderScene'
          readelf -d /tmp/libodpar_lab.so | tee native-dynamic.txt
          sha256sum "$APK" | tee app-debug.apk.sha256
          sha256sum /tmp/libodpar_lab.so | tee libodpar_lab.so.sha256
          cp "$APK" ODPAR-Music-Motion-Engine-Lab-0.52-r29-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ODPAR-Music-Motion-Engine-Lab-0.52-r29-APK
          path: |
            android_engine_lab/ODPAR-Music-Motion-Engine-Lab-0.52-r29-arm64.apk
            android_engine_lab/app-debug.apk.sha256
            android_engine_lab/libodpar_lab.so.sha256
            android_engine_lab/native-dynamic.txt
          if-no-files-found: error
          retention-days: 30
