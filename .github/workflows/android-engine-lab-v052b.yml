name: Build ODPAR Android Engine Lab 0.52b
on:
  push:
    branches: [ "agent/android-engine-lab-v052" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OFFICIAL_ENGINE_SHA256: 64d786ca5850519a324d2aff70f26134ac25ff4edb959da943e093f82cc47fc8
      APP_TARBALL_SHA256: 94325c6a5d2ffefdf2d328fe0a3d18b72ab68f19f1ddfa244f72e48f89bd004d
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Android app
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .odpar/android/app_payload.b64 > /tmp/app.tar.gz
          echo "$APP_TARBALL_SHA256  /tmp/app.tar.gz" | sha256sum -c -
          mkdir android_engine_lab
          tar -xzf /tmp/app.tar.gz -C android_engine_lab
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch and verify official ODPAR 0.52 source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q gdown
          gdown 'https://drive.google.com/file/d/117etA7LrenJFEpgzYeRhD19T_jlY-TmA/view?usp=drivesdk' -O /tmp/official-engine.zip
          echo "$OFFICIAL_ENGINE_SHA256  /tmp/official-engine.zip" | sha256sum -c -
          mkdir -p android_engine_lab/app/src/main/cpp/engine
          unzip -q /tmp/official-engine.zip -d android_engine_lab/app/src/main/cpp/engine
          test "$(find android_engine_lab/app/src/main/cpp/engine/src -name '*.c' | wc -l)" -eq 184
          test "$(find android_engine_lab/app/src/main/cpp/engine/src -name '*.c' ! -path '*/cli/*' | wc -l)" -eq 182
          grep -q '0.52.0-world3d-shadow-material-wip-v52' android_engine_lab/app/src/main/cpp/engine/CHECKPOINT_STATUS.json
          grep -q '"abi_version": 11' android_engine_lab/app/src/main/cpp/engine/CHECKPOINT_STATUS.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Stage libpng
        working-directory: android_engine_lab
        run: |
          mkdir -p app/src/main/cpp/third_party
          git clone --depth 1 --branch v1.6.50 https://github.com/pnggroup/libpng.git app/src/main/cpp/third_party/libpng
      - name: Build OpenSSL libcrypto ARM64
        working-directory: android_engine_lab
        run: |
          set -euo pipefail
          git clone --depth 1 --branch openssl-3.3.2 https://github.com/openssl/openssl.git /tmp/openssl-src
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd /tmp/openssl-src
          perl Configure android-arm64 -D__ANDROID_API__=28 no-shared no-tests no-apps no-docs --prefix="$GITHUB_WORKSPACE/android_engine_lab/app/src/main/cpp/third_party/openssl"
          make -j2 build_libs
          make install_dev
          cp "$GITHUB_WORKSPACE/android_engine_lab/app/src/main/cpp/third_party/openssl/lib/libcrypto.a" "$GITHUB_WORKSPACE/android_engine_lab/app/src/main/cpp/third_party/openssl/libcrypto.a"
      - name: Build full-surface APK
        working-directory: android_engine_lab
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        working-directory: android_engine_lab
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -p "$APK" lib/arm64-v8a/libodpar_lab.so > /tmp/libodpar_lab.so
          test -s /tmp/libodpar_lab.so
          nm -D /tmp/libodpar_lab.so | grep Java_com_odpar_musicmotionlab_MainActivity_nativeRenderScene
          sha256sum "$APK" | tee app-debug.apk.sha256
          sha256sum /tmp/libodpar_lab.so | tee libodpar_lab.so.sha256
          cp "$APK" ODPAR-Music-Motion-Engine-Lab-0.52-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ODPAR-Music-Motion-Engine-Lab-0.52-APK
          path: |
            android_engine_lab/ODPAR-Music-Motion-Engine-Lab-0.52-arm64.apk
            android_engine_lab/app-debug.apk.sha256
            android_engine_lab/libodpar_lab.so.sha256
          if-no-files-found: error
          retention-days: 14
