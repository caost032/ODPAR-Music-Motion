name: ODPAR Drive source probe
on:
  push:
    branches: ["android-drive-probe-v052"]
    paths: [".github/workflows/android-drive-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download canonical ODPAR 0.52 ZIP from Drive
        env:
          DRIVE_ID: 117etA7LrenJFEpgzYeRhD19T_jlY-TmA
          EXPECTED_SHA256: 64d786ca5850519a324d2aff70f26134ac25ff4edb959da943e093f82cc47fc8
        run: |
          python -m pip install --disable-pip-version-check -q gdown
          gdown --id "$DRIVE_ID" -O ODPAR-Music-Motion-LATEST.zip
          test -s ODPAR-Music-Motion-LATEST.zip
          echo "$EXPECTED_SHA256  ODPAR-Music-Motion-LATEST.zip" | sha256sum -c -
          unzip -q ODPAR-Music-Motion-LATEST.zip -d engine
          test "$(find engine/src -name '*.c' ! -path '*/cli/*' | wc -l)" -eq 182
          grep -q '0.52.0-world3d-shadow-material-wip-v52' engine/CHECKPOINT_STATUS.json
          echo 'ODPAR_CANONICAL_DRIVE_SOURCE=PASS'
