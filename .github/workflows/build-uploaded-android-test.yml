name: LEGACY - Uploaded Native Android Test (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uploaded-android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Extract engine and apply verified Authoring Studio overrides
        run: |
          test -s ODPAR-Music-Motion-Android-Test-2026-08-18.zip
          mkdir prepared
          unzip -q ODPAR-Music-Motion-Android-Test-2026-08-18.zip -d prepared
          test -d android-test-overrides
          cp -a android-test-overrides/. prepared/
          test -f prepared/android/app/src/main/cpp/native_bridge.c
          test -f prepared/android/app/src/main/java/com/odpar/musicmotion/MainActivity.java
          test -f prepared/android/app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android toolchain
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p prepared/android --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and native libraries
        run: |
          APK=prepared/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libodpar_authoring3d.so'
          unzip -l "$APK" | grep 'lib/x86_64/libodpar_authoring3d.so'
          mkdir -p /tmp/odpar-apk
          unzip -q "$APK" 'lib/*/libodpar_authoring3d.so' -d /tmp/odpar-apk
          READELF="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" -lW /tmp/odpar-apk/lib/arm64-v8a/libodpar_authoring3d.so | grep -E 'LOAD.*0x4000'
          "$READELF" -lW /tmp/odpar-apk/lib/x86_64/libodpar_authoring3d.so | grep -E 'LOAD.*0x4000'

      - uses: actions/upload-artifact@v4
        with:
          name: legacy-odpar-native-authoring-apk
          path: prepared/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
