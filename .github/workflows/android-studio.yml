name: Build ODPAR Music Motion Studio

on:
  push:
    branches: [ "claude/motor-improvement-sr808c" ]
    paths:
      - "android_studio/**"
      - ".github/workflows/android-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Stage canonical ODPAR engine
        working-directory: android_studio
        env:
          ODPAR_DRIVE_ID: 117etA7LrenJFEpgzYeRhD19T_jlY-TmA
          ODPAR_EXPECTED_SHA256: 64d786ca5850519a324d2aff70f26134ac25ff4edb959da943e093f82cc47fc8
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check -q gdown
          gdown "$ODPAR_DRIVE_ID" -O canonical-engine.zip
          echo "$ODPAR_EXPECTED_SHA256  canonical-engine.zip" | sha256sum -c -
          mkdir -p app/src/main/cpp/engine app/src/main/cpp/generated
          unzip -q canonical-engine.zip -d app/src/main/cpp/engine
          test "$(find app/src/main/cpp/engine/src -name '*.c' ! -path '*/cli/*' | wc -l)" -eq 182
          python app/src/main/cpp/engine/tools/gen_build_meta.py --output app/src/main/cpp/generated/odm_build_meta.h
          grep -q '0.52.0-world3d-shadow-material-wip-v52' app/src/main/cpp/engine/CHECKPOINT_STATUS.json

      - name: Build pinned native dependencies
        working-directory: android_studio
        env:
          OPENSSL_COMMIT: 8cf17aaeb4599f8af87fefd810b5b5fee90fe69e
        run: |
          set -euxo pipefail
          ROOT="$PWD"
          THIRD="$ROOT/app/src/main/cpp/third_party"
          mkdir -p "$THIRD"
          git clone --depth 1 --branch v1.6.50 https://github.com/pnggroup/libpng.git "$THIRD/libpng"
          git clone --depth 1 --branch openssl-3.5.7 https://github.com/openssl/openssl.git "$THIRD/openssl-src"
          test "$(git -C "$THIRD/openssl-src" rev-parse HEAD)" = "$OPENSSL_COMMIT"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd "$THIRD/openssl-src"
          ./Configure android-arm64 -D__ANDROID_API__=28 no-shared no-tests no-apps no-docs \
            --prefix="$THIRD/openssl-install" --libdir=lib
          make -j2 build_libs
          make install_sw
          test -s "$THIRD/openssl-install/lib/libcrypto.a"
          test -f "$THIRD/openssl-install/include/openssl/evp.h"

      - name: Build Studio ARM64 APK
        working-directory: android_studio
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK, launcher, JNI and ELF
        working-directory: android_studio
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.odpar.musicmotion'" apk-badging.txt
          grep -q "launchable-activity: name='com.odpar.musicmotion.MainActivity'" apk-badging.txt
          unzip -l "$APK" | tee apk-files.txt
          grep -q 'lib/arm64-v8a/libodpar_studio.so' apk-files.txt
          unzip -p "$APK" lib/arm64-v8a/libodpar_studio.so > /tmp/libodpar_studio.so
          "$NDK/llvm-readelf" -d /tmp/libodpar_studio.so | tee native-dynamic.txt
          "$NDK/llvm-nm" -D --defined-only /tmp/libodpar_studio.so | tee native-symbols.txt
          grep -q 'Java_com_odpar_musicmotion_MainActivity_nativeBootstrap' native-symbols.txt
          grep -q 'Java_com_odpar_musicmotion_MainActivity_nativeSchemaManifest' native-symbols.txt
          grep -q 'Java_com_odpar_musicmotion_MainActivity_nativeRenderViewport' native-symbols.txt
          grep -q 'Java_com_odpar_musicmotion_MainActivity_nativeMeshPrimitive' native-symbols.txt
          sha256sum "$APK" | tee app-debug.apk.sha256
          cp "$APK" ODPAR-Music-Motion-Studio-v0.5-arm64.apk

      - name: Build receipt
        working-directory: android_studio
        run: |
          {
            echo "# ODPAR Music Motion Studio v0.5"
            echo
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "engine_sha256=64d786ca5850519a324d2aff70f26134ac25ff4edb959da943e093f82cc47fc8"
            echo "engine_sources=182"
            echo "apk_sha256=$(cut -d' ' -f1 app-debug.apk.sha256)"
            echo
            grep "launchable-activity:" apk-badging.txt
            echo
            echo "## DT_NEEDED"
            grep NEEDED native-dynamic.txt || true
            echo
            echo "## JNI surface"
            grep 'Java_com_odpar_musicmotion_MainActivity_native' native-symbols.txt | sed 's/.* Java_/Java_/'
          } > BUILD_RECEIPT.md

      - uses: actions/upload-artifact@v4
        with:
          name: ODPAR-Music-Motion-Studio-v0.5-APK
          path: |
            android_studio/ODPAR-Music-Motion-Studio-v0.5-arm64.apk
            android_studio/app-debug.apk.sha256
            android_studio/BUILD_RECEIPT.md
            android_studio/apk-badging.txt
            android_studio/native-dynamic.txt
            android_studio/native-symbols.txt
          if-no-files-found: error
          retention-days: 14
