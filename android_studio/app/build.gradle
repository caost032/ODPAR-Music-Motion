plugins { id 'com.android.application' }

android {
    namespace 'com.odpar.musicmotion'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.odpar.musicmotion'
        minSdk 28
        targetSdk 35
        versionCode 5
        versionName '0.5.0-studio'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                cFlags '-O3 -fvisibility=hidden'
            }
        }
    }

    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }

    buildTypes {
        debug { debuggable true; jniDebuggable false }
        release { minifyEnabled false; ndk { debugSymbolLevel 'SYMBOL_TABLE' } }
    }
    packaging { jniLibs { useLegacyPackaging true } }
}
